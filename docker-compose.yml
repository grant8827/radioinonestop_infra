# ─────────────────────────────────────────────────────────────────
# Radio In One Stop — Production Docker Compose
#
# Services:
#   backend   Go server — RTMP ingest (1935) + HLS serving (8080)
#             Spawns FFmpeg per live stream.
#   frontend  Vite build served by Nginx (internal port 3000)
#   nginx     Public-facing reverse proxy with SSL termination.
#             Ports 80 + 443 exposed to the host.
#
# SSL: place your cert at ./ssl/cert.pem and ./ssl/key.pem.
#      For Let's Encrypt, mount /etc/letsencrypt or use Certbot
#      companion (see README). For local dev, generate a self-signed
#      cert: ./scripts/gen-cert.sh (provided below).
#
# Concurrency: backend HLS segments are static files served by
# Go's net/http which handles 500+ concurrent readers trivially.
# Nginx in front adds connection pooling, keep-alive, and caching
# for segment files so the backend sees far fewer total requests.
# ─────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ams_backend
    restart: unless-stopped
    # MediaMTX is the sole RTMP ingest endpoint (port 1935).
    # Go RTMP server is disabled via DISABLE_GO_RTMP=1 below.
    # No host port is needed; Nginx reaches the backend on the Compose network.
    env_file:
      - ../backend/.env
    environment:
      - PORT=8080
      - DISABLE_GO_RTMP=1
      - HLS_BASE_URL=${HLS_BASE_URL:-https://localhost}
      # Icecast target for the browser encoder (ffmpeg push destination).
      # On Railway set ICECAST_HOST=${{ icecast.RAILWAY_PRIVATE_DOMAIN }}
      # on the backend service, replacing "icecast" with the exact service name.
      - ICECAST_HOST=icecast
      - ICECAST_PORT=8000
      # Shared source secret used by backend->Icecast push when configured.
      # Keep this identical to the Icecast source-password in icecast.xml.
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:-changeme123}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD:-changeme123}
    volumes:
      # Shared HLS segment volume so Nginx can serve segments directly
      # from disk without proxying through the Go server (optional optimisation).
      - hls_segments:/tmp/hls
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  icecast:
    build:
      context: .
      dockerfile: icecast/Dockerfile
    container_name: ams_icecast
    restart: unless-stopped
    # Port 8000 exposed to host so source clients (BUTT, Mixxx, etc.) can
    # connect directly without going through Nginx.
    # Listeners use HTTPS at /icecast/radio via Nginx (below).
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:-changeme123}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD:-changeme123}
      - ICECAST_HOSTNAME=${ICECAST_HOSTNAME:-localhost}

  # Keeps listener connections open while any individual station encoder
  # briefly reconnects. Icecast moves listeners back to their original mount
  # automatically because fallback-override is enabled on station mounts.
  icecast-standby:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ams_icecast_standby
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec ffmpeg -hide_banner -loglevel warning -re
        -f lavfi -i anullsrc=r=44100:cl=stereo
        -vn -c:a libmp3lame -b:a 192k -content_type audio/mpeg
        -f mp3 "icecast://source:$${ICECAST_SOURCE_PASSWORD}@icecast:8000/__standby"
    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:-changeme123}
    depends_on:
      icecast:
        condition: service_started

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ams_mediamtx
    restart: unless-stopped
    # Ports 1935 (RTMP ingest), 8889 (WebRTC WHIP), and 8888 (HLS).
    ports:
      - "1935:1935"
      - "8889:8889"
      - "8888:8888"
      # WebRTC ICE requires UDP ports to negotiate media streams
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - hls_segments:/tmp/hls
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ams_frontend
    restart: unless-stopped
    # Not exposed to the host — Nginx proxies to it internally.
    expose:
      - "80"
    environment:
      - BACKEND_URL=http://backend:8080
      - PORT=80
      # Icecast URL for the /icecast/ nginx proxy (listener access).
      # On Railway set ICECAST_URL=http://${{ icecast.RAILWAY_PRIVATE_DOMAIN }}:8000
      # on this service, replacing "icecast" with the exact service name.
      - ICECAST_URL=http://icecast:8000
      - WEBRTC_URL=http://mediamtx:8889
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: ams_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      # Serve HLS segments directly from disk — bypass the Go server for
      # the static file path, cutting latency and CPU in half at scale.
      - hls_segments:/var/www/hls:ro
    depends_on:
      - frontend
      - backend

volumes:
  hls_segments:
