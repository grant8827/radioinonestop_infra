###############################################
# MediaMTX — Low-Latency HLS Configuration
# Docs: https://github.com/bluenviron/mediamtx
###############################################

logLevel: info
logDestinations: [stdout]

# ── Auth webhook (STRM-8) ─────────────────────────────────────────────────────
# MediaMTX calls this URL for every publish / read attempt.
# Go returns 200 to allow or 403 to reject.
# Leave blank to disable (useful in dev without the backend running).
# Set AUTH_INTERNAL_JWT=1 on the backend env and generate a shared secret to
# secure the callback; the backend reads X-Stream-Auth-Token from each request.
externalAuthenticationURL: http://backend:8080/api/stream/auth

# MediaMTX API (stream management)
api: yes
apiAddress: :9997

# RTMP ingest (MediaMTX is the sole endpoint on :1935)
rtmp: yes
rtmpAddress: :1935

# HLS — write segments to shared volume so Nginx can serve them
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency        # low-latency HLS (LLHLS)
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms        # targets ~500ms latency
hlsSegmentMaxSize: 50MB
hlsAllowOrigin: "*"           # allow browser cross-origin requests
hlsDirectory: /tmp/hls        # write to shared Docker volume

# WebRTC WHIP — browser broadcaster
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: "*"

# RTSP — internal only; used by FFmpeg relay to pull WebRTC streams
rtsp: yes
rtspAddress: :8554

###############################################
# Stream paths
#
# Radio:  rtmp://<server>:1935/live/radio
# Video:  rtmp://<server>:1935/live/video
#
# HLS playback URLs (for Admin Settings):
#   http://<server>:8888/live/radio/index.m3u8
#   http://<server>:8888/live/video/index.m3u8
###############################################
paths:
  # Browser broadcaster — WebRTC WHIP → HLS
  # WHIP endpoint: /webrtc/radio/whip  (proxied by Nginx)
  # HLS output:    /hls/radio/index.m3u8
  radio:
    source: publisher
    maxReaders: 200

  live:
    source: publisher
    maxReaders: 200
    # Lifecycle webhooks for Go orchestrator (STRM-1 style contract).
    runOnPublish: >-
      sh -c 'curl -sS -X POST http://backend:8080/api/stream/status
      -H "Content-Type: application/json"
      -H "X-Stream-Status-Token: ${STREAM_STATUS_TOKEN:-}"
      -d "{\"action\":\"publish\",\"user\":\"$MTX_PATH\",\"path\":\"$MTX_PATH\"}" || true'
    runOnUnpublish: >-
      sh -c 'curl -sS -X POST http://backend:8080/api/stream/status
      -H "Content-Type: application/json"
      -H "X-Stream-Status-Token: ${STREAM_STATUS_TOKEN:-}"
      -d "{\"action\":\"done\",\"user\":\"$MTX_PATH\",\"path\":\"$MTX_PATH\"}" || true'

  # Legacy paths (keep for backwards compat with existing OBS configs)
  live/radio:
    source: publisher
    maxReaders: 200

  live/video:
    source: publisher
    maxReaders: 200

  # Catch-all (optional — accepts any path)
  ~^.*$:
    source: publisher
    runOnPublish: >-
      sh -c 'curl -sS -X POST http://backend:8080/api/stream/status
      -H "Content-Type: application/json"
      -H "X-Stream-Status-Token: ${STREAM_STATUS_TOKEN:-}"
      -d "{\"action\":\"publish\",\"user\":\"$MTX_PATH\",\"path\":\"$MTX_PATH\"}" || true'
    runOnUnpublish: >-
      sh -c 'curl -sS -X POST http://backend:8080/api/stream/status
      -H "Content-Type: application/json"
      -H "X-Stream-Status-Token: ${STREAM_STATUS_TOKEN:-}"
      -d "{\"action\":\"done\",\"user\":\"$MTX_PATH\",\"path\":\"$MTX_PATH\"}" || true'
