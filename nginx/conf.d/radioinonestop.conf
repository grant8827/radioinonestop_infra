# ─────────────────────────────────────────────────────────────────
# Radio In One Stop — Virtual-host config
#
# HTTP → redirect to HTTPS
# HTTPS → SPA + API proxy + HLS direct file serving
# ─────────────────────────────────────────────────────────────────

# ── HTTP: force redirect to HTTPS ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow ACME HTTP-01 challenge (Let's Encrypt / Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main server ─────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ── TLS ──────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern TLS — TLS 1.2 for older Android/iOS devices + TLS 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:'
                'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:'
                'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:'
                'DHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — only enable once SSL is confirmed working
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                always;
    add_header X-Content-Type-Options "nosniff"                   always;
    add_header X-XSS-Protection       "1; mode=block"             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── HLS segments — served directly from disk ─────────────────
    # This bypasses the Go backend entirely for segment/manifest
    # requests, which is the hot path at 500+ concurrent listeners.
    location /hls/ {
        alias /var/www/hls/;

        # Manifests must NOT be cached — they update every ~1 s
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
            add_header Content-Type  "application/vnd.apple.mpegurl";
            # Allow hls.js cross-origin fetch in Safari
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
        }

        # Segments are immutable — cache aggressively
        location ~* \.(mp4|ts|m4s)$ {
            add_header Cache-Control "public, max-age=86400, immutable";
            add_header Content-Type  "video/mp4";
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
        }

        # Support byte-range requests for partial segment preload
        add_header Accept-Ranges bytes;
    }

    # ── Icecast2 — listener HTTPS access ─────────────────────────
    # Listeners stream at: https://<host>/icecast/radio
    # Source clients (BUTT, Mixxx) connect directly on port 8000.
    location /icecast/ {
        proxy_pass         http://icecast/;
        proxy_http_version 1.0;   # Icecast source clients use HTTP/1.0
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Don't buffer audio stream — send chunks to listener immediately
        proxy_buffering         off;
        proxy_request_buffering off;

        # Keep the streaming connection alive
        proxy_read_timeout    3600s;
        proxy_connect_timeout 10s;

        # Forward the Icy-Metadata request header so Icecast injects
        # track title metadata into the stream for compatible players.
        proxy_pass_request_headers on;

        # Pass ICY response headers through to listeners — required by
        # RadioBoss, WinAmp, VLC, and any Icecast-aware client.
        proxy_pass_header icy-name;
        proxy_pass_header icy-genre;
        proxy_pass_header icy-url;
        proxy_pass_header icy-description;
        proxy_pass_header icy-metaint;
        proxy_pass_header icy-br;
        proxy_pass_header icy-pub;
        proxy_pass_header icy-audio-info;

        # Allow cross-origin audio playback (e.g. embedded players)
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── WebRTC WHIP (MediaMTX) ────────────────────────────────────
    # Canonical publish path used by frontend: POST /webrtc/{key}/whip
    # Map explicitly to MediaMTX's per-path WHIP endpoint: /{key}/whip
    location ~ ^/webrtc/([^/]+)/whip$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass         http://mediamtx;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Compatibility path for clients that send: POST /webrtc/whip/{key}
    location ~ ^/webrtc/whip/([^/]+)$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/webrtc/whip/(.*)$ /$1/whip break;
        proxy_pass         http://mediamtx;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Fallback for other WebRTC-related MediaMTX endpoints
    location /webrtc/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass         http://mediamtx;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── API proxy ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";   # enable keepalive
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── WebSocket chat ────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;   # keep WS alive for 24 h
    }

    # ── SPA (React) ───────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;

        # Let client-side router handle unknown paths
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
