# ─────────────────────────────────────────────────────────────────
# Nginx main config — Radio In One Stop
# Tuned for 500+ concurrent HLS listeners.
# ─────────────────────────────────────────────────────────────────

# One worker per CPU core.
worker_processes auto;

# Each worker can handle up to 4096 simultaneous connections.
# 500 listeners × ~2 long-poll connections each = 1000 conns/worker.
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 200;
    types_hash_max_size 2048;
    server_tokens       off;

    # ── Compression ────────────────────────────────────────────────
    # Do NOT gzip .m3u8 or segments — hls.js handles them raw and
    # compression on already-compressed media wastes CPU.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── Upstream pools ─────────────────────────────────────────────
    upstream backend {
        server backend:8080;
        keepalive 64;   # reuse connections to Go — critical at 500+ users
    }

    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    upstream mediamtx {
        server mediamtx:8889;
        keepalive 16;
    }

    upstream icecast {
        server icecast:8000;
        keepalive 16;
    }

    # ── Include vhost configs ─────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
